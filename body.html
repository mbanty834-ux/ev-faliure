<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV Battery Diagnostic Dashboard (CSS 3D)</title>
    <style>
        :root {
            --primary: #00ff88;
            --danger: #ef4444;
            --bg-dark: #090d16;
            --bg-card: #0f172a;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* LEFT SIDE: CSS 3D VISUALIZATION */
        #stage-container {
            width: 50%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            background: radial-gradient(circle at center, #1e293b 0%, #090d16 70%);
            border-right: 1px solid var(--border-color);
        }

        #hud {
            position: absolute;
            top: 30px;
            left: 30px;
        }

        #hud h2 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        #status-text {
            font-size: 22px;
            font-weight: bold;
            color: var(--primary);
            transition: color 0.5s ease;
        }

        /* 3D Perspective Viewport */
        .stage3d {
            width: 100%;
            height: 400px;
            perspective: 1000px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 3D Object Container */
        .battery3d {
            position: relative;
            width: 120px;
            height: 220px;
            transform-style: preserve-3d;
            animation: orbit3d 12s linear infinite;
        }

        @keyframes orbit3d {
            0%   { transform: rotateX(-15deg) rotateY(0deg); }
            100% { transform: rotateX(-15deg) rotateY(360deg); }
        }

        /* Base Face Properties (Glassmorphism + Glow) */
        .face {
            position: absolute;
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid var(--primary);
            box-shadow: inset 0 0 15px rgba(0, 255, 136, 0.25), 0 0 10px rgba(0, 255, 136, 0.2);
            backdrop-filter: blur(4px);
            transition: all 0.5s ease;
        }

        /* Face Coordinates & Transforms */
        .front  { width: 120px; height: 220px; transform: translateZ(40px); }
        .back   { width: 120px; height: 220px; transform: rotateY(180deg) translateZ(40px); }
        .left   { width: 80px;  height: 220px; transform: rotateY(-90deg) translateZ(40px); left: 20px; }
        .right  { width: 80px;  height: 220px; transform: rotateY(90deg) translateZ(80px); left: 20px; }
        .top    { width: 120px; height: 80px;  transform: rotateX(90deg) translateZ(40px); top: -20px; }
        .bottom { width: 120px; height: 80px;  transform: rotateX(-90deg) translateZ(180px); top: -20px; }

        /* Positive Terminal (+ Pole) */
        .terminal {
            position: absolute;
            width: 40px;
            height: 40px;
            background: #334155;
            border: 1px solid var(--primary);
            top: -20px;
            left: 40px;
            transform: rotateX(90deg) translateZ(55px);
            box-shadow: 0 0 8px rgba(0, 255, 136, 0.4);
            transition: all 0.5s ease;
        }

        /* Glowing Inner Energy Core */
        .energy-core {
            width: 80%;
            height: 70%;
            margin: 15% auto;
            background: linear-gradient(0deg, var(--primary) 0%, rgba(0, 255, 136, 0.1) 100%);
            border-radius: 4px;
            box-shadow: 0 0 15px var(--primary);
            transition: all 0.5s ease;
        }

        /* 3D FAILURE STATE MODIFIERS */
        .battery3d.state-failure .face {
            border-color: var(--danger);
            box-shadow: inset 0 0 25px rgba(239, 68, 68, 0.6), 0 0 20px rgba(239, 68, 68, 0.5);
            animation: pulse-danger 1s infinite alternate ease-in-out;
        }

        .battery3d.state-failure .terminal {
            border-color: var(--danger);
            box-shadow: 0 0 12px var(--danger);
        }

        .battery3d.state-failure .energy-core {
            background: linear-gradient(0deg, var(--danger) 0%, rgba(239, 68, 68, 0.1) 100%);
            box-shadow: 0 0 25px var(--danger);
        }

        @keyframes pulse-danger {
            from { filter: drop-shadow(0 0 2px rgba(239, 68, 68, 0.4)); }
            to   { filter: drop-shadow(0 0 18px rgba(239, 68, 68, 1)); }
        }

        /* RIGHT SIDE: FASTAPI FORM & CONTROL PANEL */
        #ui-panel {
            width: 50%;
            height: 100%;
            background-color: var(--bg-card);
            padding: 40px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 8px;
            display: inline-block;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 11px;
            margin-bottom: 5px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            color: white;
            padding: 10px;
            border-radius: 4px;
            outline: none;
            transition: border 0.3s;
        }

        input:focus {
            border-color: var(--primary);
        }

        button {
            background-color: var(--primary);
            color: #000;
            border: none;
            padding: 14px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover { opacity: 0.9; }
        button:active { transform: scale(0.99); }

        #result-box {
            margin-top: 20px;
            padding: 18px;
            border-radius: 4px;
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>

    <div id="stage-container">
        <div id="hud">
            <h2>System State</h2>
            <div id="status-text">Idling</div>
        </div>

        <div class="stage3d">
            <div class="battery3d" id="battery3d">
                <div class="face top"></div>
                <div class="terminal"></div>
                <div class="face front">
                    <div class="energy-core"></div>
                </div>
                <div class="face back"></div>
                <div class="face left"></div>
                <div class="face right"></div>
                <div class="face bottom"></div>
            </div>
        </div>
    </div>

    <div id="ui-panel">
        <h1>EV Telemetry Parameters</h1>
        <form id="prediction-form">
            <div class="form-grid">
                <div class="input-group">
                    <label>Capacity (kWh)</label>
                    <input type="number" step="0.1" id="battery_capacity_kwh" value="60.5" required>
                </div>
                <div class="input-group">
                    <label>Odometer (km)</label>
                    <input type="number" id="odometer_km" value="45000" required>
                </div>
                <div class="input-group">
                    <label>Vehicle Age (Years)</label>
                    <input type="number" step="0.1" id="vehicle_age_years" value="4" required>
                </div>
                <div class="input-group">
                    <label>Cycle Count</label>
                    <input type="number" id="cycle_count" value="800" required>
                </div>
                <div class="input-group">
                    <label>State of Charge (%)</label>
                    <input type="number" step="0.1" id="state_of_charge" value="75.0" required>
                </div>
                <div class="input-group">
                    <label>State of Health (%)</label>
                    <input type="number" step="0.1" id="state_of_health" value="90.0" required>
                </div>
                <div class="input-group">
                    <label>Max Cell Temp (°C)</label>
                    <input type="number" step="0.1" id="cell_temperature_max" value="42.5" required>
                </div>
                <div class="input-group">
                    <label>Cell Voltage Std</label>
                    <input type="number" step="0.001" id="cell_voltage_std" value="0.025" required>
                </div>
                <div class="input-group">
                    <label>Internal Res. (Ω)</label>
                    <input type="number" step="0.001" id="internal_resistance" value="0.015" required>
                </div>
                <div class="input-group">
                    <label>Capacity Loss (%)</label>
                    <input type="number" step="0.1" id="capacity_loss_percent" value="8.5" required>
                </div>
                <div class="input-group">
                    <label>Charging Interrupts</label>
                    <input type="number" id="charging_interruptions" value="3" required>
                </div>
                <div class="input-group">
                    <label>Overcharge Events</label>
                    <input type="number" id="overcharge_events" value="1" required>
                </div>

                <input type="hidden" id="battery_health_percent" value="92.5">
                <input type="hidden" id="depth_of_discharge" value="65.0">
            </div>

            <button type="submit">Execute Model Diagnostic</button>
        </form>

        <div id="result-box">
            <div id="pred-text" style="font-weight: bold; font-size: 20px;"></div>
            <div id="prob-text" style="margin-top: 6px; color: var(--text-muted); font-size: 14px;"></div>
        </div>
    </div>

    <script>
        const form = document.getElementById('prediction-form');
        const resultBox = document.getElementById('result-box');
        const predText = document.getElementById('pred-text');
        const probText = document.getElementById('prob-text');
        const statusText = document.getElementById('status-text');
        const battery3d = document.getElementById('battery3d');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const payload = {
                battery_capacity_kwh: parseFloat(document.getElementById('battery_capacity_kwh').value),
                odometer_km: parseFloat(document.getElementById('odometer_km').value),
                vehicle_age_years: parseFloat(document.getElementById('vehicle_age_years').value),
                cycle_count: parseInt(document.getElementById('cycle_count').value),
                battery_health_percent: parseFloat(document.getElementById('battery_health_percent').value),
                state_of_charge: parseFloat(document.getElementById('state_of_charge').value),
                depth_of_discharge: parseFloat(document.getElementById('depth_of_discharge').value),
                state_of_health: parseFloat(document.getElementById('state_of_health').value),
                cell_voltage_std: parseFloat(document.getElementById('cell_voltage_std').value),
                cell_temperature_max: parseFloat(document.getElementById('cell_temperature_max').value),
                internal_resistance: parseFloat(document.getElementById('internal_resistance').value),
                capacity_loss_percent: parseFloat(document.getElementById('capacity_loss_percent').value),
                charging_interruptions: parseInt(document.getElementById('charging_interruptions').value),
                overcharge_events: parseInt(document.getElementById('overcharge_events').value)
            };

            statusText.innerText = "Analyzing...";
            statusText.style.color = "#fbbf24";

            try {
                const response = await fetch('', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error("Backend connection error");

                const data = await response.json();
                resultBox.style.display = "block";

                const isFailure = (data.prediction === "1" || data.prediction === "True" || data.prediction === 1);

                if (isFailure) {
                    predText.innerText = "⚠️ CRITICAL: Battery Failure Predicted";
                    predText.style.color = "var(--danger)";
                    statusText.innerText = "Failure Hazard";
                    statusText.style.color = "var(--danger)";
                    
                    // Trigger CSS 3D Red Pulse Glow
                    battery3d.classList.add('state-failure');
                } else {
                    predText.innerText = "✅ Battery Operating Normally";
                    predText.style.color = "var(--primary)";
                    statusText.innerText = "Optimal Health";
                    statusText.style.color = "var(--primary)";

                    // Revert to CSS 3D Green Glow
                    battery3d.classList.remove('state-failure');
                }

                if (data.probability !== undefined) {
                    probText.innerText = `Confidence Level: ${(data.probability * 100).toFixed(1)}%`;
                }

            } catch (error) {
                console.error("API Error:", error);
                alert("Failed to communicate with FastAPI at  http://127.0.0.1:5643/predict. Ensure your FastAPI server is running with CORS enabled.");
            }
        });
    src="script.js"
    </script>
</body>
</html>
